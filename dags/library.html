<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Library</title>
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; font: 17px/1.6 system-ui, sans-serif; color: #202020; background: #fafafa; }
    h1 { margin-bottom: 0; }
    h2 { font-size: 1.2rem; line-height: 1.4; }
    a { color: #14598a; }
    label { display: block; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; border: 1px solid #777; border-radius: 4px; }
    article { margin: 20px 0; padding: 18px 24px; border: 1px solid #ddd; background: white; }
    .category, .filename { color: #555; font-size: .9rem; }
    .filename { overflow-wrap: anywhere; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Research Library</h1>
  <p>Paper summaries generated by a local language model. Check the PDF for details.</p>
  <label for="search">Search title, summary, keywords or category</label>
  <input id="search" type="search" placeholder="For example: machine learning" autocomplete="off">
  <p id="count" aria-live="polite"></p>
  <noscript>Search needs JavaScript. All papers are listed below.</noscript>
  <main>
<!-- PAPER_CARDS -->
  </main>
  <p id="empty" hidden>No papers match your search.</p>
  <script>
    const search = document.getElementById('search');
    const cards = [...document.querySelectorAll('article')];
    function filterPapers() {
      const query = search.value.trim().toLocaleLowerCase();
      let visible = 0;
      for (const card of cards) {
        card.hidden = !card.textContent.toLocaleLowerCase().includes(query);
        if (!card.hidden) visible++;
      }
      document.getElementById('count').textContent = `${visible} of ${cards.length} papers`;
      document.getElementById('empty').hidden = visible !== 0;
    }
    search.addEventListener('input', filterPapers);
    filterPapers();
  </script>
</body>
</html>
